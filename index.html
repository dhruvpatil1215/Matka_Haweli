<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Phone OTP Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111827;
        }

        .container{
            width:350px;
            background:#1f2937;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        #otp-box{
            display:none;
        }

        #success{
            color:#22c55e;
            margin-top:15px;
            text-align:center;
        }

        #error{
            color:#ef4444;
            margin-top:15px;
            text-align:center;
        }

        .google-btn{
            margin-top:15px;
            background:#dc2626;
        }

        .google-btn:hover{
            background:#b91c1c;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Phone OTP Login</h2>

    <input type="text" id="phone" placeholder="+91xxxxxxxxxx">

    <div id="recaptcha-container"></div>

    <button onclick="sendOTP()">Send OTP</button>

    <div id="otp-box">

        <input type="text" id="otp" placeholder="Enter OTP">

        <button onclick="verifyOTP()">Verify OTP</button>

    </div>

    <button class="google-btn" onclick="googleLogin()">
        Login with Google
    </button>

    <div id="success"></div>
    <div id="error"></div>

</div>

<script type="module">

// Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDU-3F68dVkWy_uCcK7EI7SJV7r7KAnKTI",
  authDomain: "testing-ff11c.firebaseapp.com",
  projectId: "testing-ff11c",
  storageBucket: "testing-ff11c.firebasestorage.app",
  messagingSenderId: "608711061077",
  appId: "1:608711061077:web:2070d0f86c154a32162edc",
  measurementId: "G-59W8ELXTPX"
};


// Initialize Firebase
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// Recaptcha
window.recaptchaVerifier = new RecaptchaVerifier(
    auth,
    'recaptcha-container',
    {
        size: 'normal',
        callback: () => {
            console.log("Recaptcha Verified");
        }
    }
);


// Send OTP
window.sendOTP = function(){

    const phoneNumber = document.getElementById("phone").value;

    document.getElementById("error").innerHTML = "";
    document.getElementById("success").innerHTML = "";

    signInWithPhoneNumber(
        auth,
        phoneNumber,
        window.recaptchaVerifier
    )

    .then((confirmationResult)=>{

        window.confirmationResult = confirmationResult;

        document.getElementById("otp-box").style.display = "block";

        document.getElementById("success").innerHTML =
            "OTP Sent Successfully";

    })

    .catch((error)=>{

        console.log(error);

        document.getElementById("error").innerHTML =
            error.message;

    });

}


// Verify OTP
window.verifyOTP = function(){

    const otp = document.getElementById("otp").value;

    document.getElementById("error").innerHTML = "";
    document.getElementById("success").innerHTML = "";

    window.confirmationResult.confirm(otp)

    .then((result)=>{

        const user = result.user;

        document.getElementById("success").innerHTML =
            "Login Successful : " + user.phoneNumber;

        console.log(user);

    })

    .catch((error)=>{

        console.log(error);

        document.getElementById("error").innerHTML =
            "Invalid OTP";

    });

}


// Google Login
window.googleLogin = function(){

    const provider = new GoogleAuthProvider();

    signInWithPopup(auth, provider)

    .then((result)=>{

        const user = result.user;

        document.getElementById("success").innerHTML =
            "Google Login Success : " + user.displayName;

        console.log(user);

    })

    .catch((error)=>{

        console.log(error);

        document.getElementById("error").innerHTML =
            error.message;

    });

}

</script>

</body>
</html>
